<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Breakout Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: env(safe-area-inset-top, 20px) 20px 20px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(15, 23, 42, 0.95);
            padding: 2.5rem 1.5rem;
            border-radius: 1.5rem;
            display: none;
            pointer-events: auto;
            width: 85%;
            max-width: 350px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            z-index: 100;
        }
        .stats-val {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="ui-layer">
        <div>SCORE: <span id="scoreDisplay" class="stats-val">0</span></div>
        <div>LIVES: <span id="livesDisplay" class="stats-val">3</span></div>
    </div>

    <div id="message">
        <h2 id="msgTitle" class="text-3xl mb-2 font-black tracking-tighter">SUPER BREAKOUT</h2>
        <p id="msgText" class="mb-8 text-slate-400">Tap to start your mission</p>
        <button id="restartBtn" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-black py-4 px-8 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-500/50">
            START GAME
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const messageBox = document.getElementById('message');
        const msgTitle = document.getElementById('msgTitle');
        const restartBtn = document.getElementById('restartBtn');

        // --- Game State ---
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let particles = [];
        let items = [];
        let shakeTime = 0;
        let frameCount = 0;

        // --- Constants & Config ---
        const BALL_SPEED_START = 5;
        const PADDLE_WIDTH_START = 100;

        // --- Objects ---
        const paddle = {
            width: PADDLE_WIDTH_START,
            height: 16,
            x: 0,
            y: 0,
            color: '#38bdf8',
            glow: 0,
            powerUpTimer: 0
        };

        const ball = {
            x: 0,
            y: 0,
            radius: 8,
            dx: 0,
            dy: 0,
            speed: BALL_SPEED_START,
            color: '#ffffff',
            isPiercing: false,
            pierceTimer: 0
        };

        const brickConfig = {
            rows: 6,
            cols: 6,
            padding: 8,
            offsetTop: 100,
            offsetLeft: 15
        };
        let bricks = [];

        // --- Initialization ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            paddle.y = canvas.height - 120;
            paddle.x = (canvas.width - paddle.width) / 2;
            initBricks();
        }
        window.addEventListener('resize', resize);

        function initBricks() {
            const availableWidth = canvas.width - (brickConfig.offsetLeft * 2);
            const brickWidth = (availableWidth - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols;
            const brickHeight = 24;

            bricks = [];
            for(let c=0; c<brickConfig.cols; c++) {
                bricks[c] = [];
                for(let r=0; r<brickConfig.rows; r++) {
                    bricks[c][r] = { 
                        x: (c * (brickWidth + brickConfig.padding)) + brickConfig.offsetLeft, 
                        y: (r * (brickHeight + brickConfig.padding)) + brickConfig.offsetTop, 
                        width: brickWidth,
                        height: brickHeight,
                        status: 1, 
                        color: `hsl(${(r * 30 + 190) % 360}, 70%, 55%)` 
                    };
                }
            }
        }

        // --- Input Handling ---
        function movePaddle(clientX) {
            if (!gameActive) return;
            let targetX = clientX - paddle.width / 2;
            if(targetX < 0) targetX = 0;
            if(targetX + paddle.width > canvas.width) targetX = canvas.width - paddle.width;
            paddle.x = targetX;
        }

        // iPhone/Android タッチイベントの修正
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches && e.touches.length > 0) {
                movePaddle(e.touches.clientX);
            }
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length > 0) {
                movePaddle(e.touches.clientX);
            }
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            movePaddle(e.clientX);
        });

        // --- FX Systems ---
        class Particle {
            constructor(x, y, color, speedScale = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.vx = (Math.random() - 0.5) * 8 * speedScale;
                this.vy = (Math.random() - 0.5) * 8 * speedScale;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnExplosion(x, y, color, count = 12) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        class PowerItem {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.dy = 3;
                const r = Math.random();
                if (r < 0.33) {
                    this.type = 'GROW'; // Blue
                    this.color = '#38bdf8';
                } else if (r < 0.66) {
                    this.type = 'SLOW'; // Green
                    this.color = '#4ade80';
                } else {
                    this.type = 'PIERCE'; // Yellow/Gold
                    this.color = '#fbbf24';
                }
            }
            update() { this.y += this.dy; }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.type, this.x + 15, this.y + 22);
                ctx.restore();
            }
        }

        // --- Game Logic ---
        function collision() {
            for(let c=0; c<brickConfig.cols; c++) {
                for(let r=0; r<brickConfig.rows; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        if(ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.width && 
                           ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.height) {
                            
                            if (!ball.isPiercing) ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreDisplay.textContent = score;
                            spawnExplosion(b.x + b.width/2, b.y + b.height/2, b.color);
                            shakeTime = 5;

                            if(Math.random() < 0.15) {
                                items.push(new PowerItem(b.x + b.width/2 - 15, b.y));
                            }

                            if(score >= brickConfig.rows * brickConfig.cols * 10) {
                                endGame("LEVEL CLEAR", "素晴らしいスキルです！✨");
                            }
                        }
                    }
                }
            }

            items.forEach((item, index) => {
                if(item.x < paddle.x + paddle.width && item.x + item.width > paddle.x &&
                   item.y < paddle.y + paddle.height && item.y + item.height > paddle.y) {
                    applyPowerUp(item.type);
                    items.splice(index, 1);
                    score += 50;
                    scoreDisplay.textContent = score;
                } else if(item.y > canvas.height) {
                    items.splice(index, 1);
                }
            });
        }

        function applyPowerUp(type) {
            paddle.glow = 20;
            if(type === 'GROW') {
                paddle.width = 180;
                paddle.powerUpTimer = 400;
            } else if(type === 'SLOW') {
                ball.speed = 3.5;
                const angle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(angle) * ball.speed;
                ball.dy = Math.sin(angle) * ball.speed;
                setTimeout(() => { ball.speed = BALL_SPEED_START; }, 6000);
            } else if(type === 'PIERCE') {
                ball.isPiercing = true;
                ball.pierceTimer = 300;
                ball.color = '#fbbf24';
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = paddle.y - 30;
            ball.speed = BALL_SPEED_START;
            ball.dx = 4;
            ball.dy = -4;
            ball.isPiercing = false;
            ball.color = '#ffffff';
        }

        function update() {
            if(!gameActive) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if(ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
                spawnExplosion(ball.x, ball.y, '#ffffff66', 3);
            }
            if(ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
                spawnExplosion(ball.x, ball.y, '#ffffff66', 3);
            } else if(ball.y + ball.radius > paddle.y) {
                if(ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    let hitPoint = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                    ball.dx = hitPoint * ball.speed;
                    ball.dy = -Math.sqrt(Math.abs(ball.speed**2 - ball.dx**2));
                    paddle.glow = 15;
                    shakeTime = 3;
                } else if(ball.y > canvas.height) {
                    lives--;
                    livesDisplay.textContent = lives;
                    shakeTime = 15;
                    if(lives <= 0) endGame("GAME OVER", "再挑戦して記録を更新しよう！");
                    else resetBall();
                }
            }

            collision();

            if(shakeTime > 0) shakeTime--;
            if(paddle.glow > 0) paddle.glow--;
            
            if(paddle.powerUpTimer > 0) {
                paddle.powerUpTimer--;
                if(paddle.powerUpTimer === 0) paddle.width = PADDLE_WIDTH_START;
            }

            if(ball.pierceTimer > 0) {
                ball.pierceTimer--;
                if(ball.pierceTimer === 0) {
                    ball.isPiercing = false;
                    ball.color = '#ffffff';
                }
            }

            particles.forEach((p, i) => {
                p.update();
                if(p.life <= 0) particles.splice(i, 1);
            });
            items.forEach(it => it.update());
        }

        function draw() {
            ctx.save();
            if(shakeTime > 0) {
                ctx.translate((Math.random()-0.5)*shakeTime, (Math.random()-0.5)*shakeTime);
            }

            const bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.height);
            bgGrad.addColorStop(0, '#0f172a');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bricks.forEach(col => col.forEach(b => {
                if(b.status === 1) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = b.color;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.roundRect(b.x, b.y, b.width, b.height, 6);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(b.x, b.y, b.width, 4);
                }
            }));

            items.forEach(it => it.draw());

            ctx.shadowBlur = paddle.glow;
            ctx.shadowColor = paddle.color;
            ctx.fillStyle = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            ctx.shadowBlur = ball.isPiercing ? 15 : 5;
            ctx.shadowColor = ball.color;
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fill();

            particles.forEach(p => p.draw());

            ctx.restore();
            update();
            requestAnimationFrame(draw);
        }

        function startGame() {
            score = 0;
            lives = 3;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            paddle.width = PADDLE_WIDTH_START;
            initBricks();
            resetBall();
            items = [];
            particles = [];
            gameActive = true;
            messageBox.style.display = 'none';
        }

        function endGame(title, text) {
            gameActive = false;
            msgTitle.textContent = title;
            document.getElementById('msgText').textContent = text;
            restartBtn.textContent = "PLAY AGAIN";
            messageBox.style.display = 'block';
        }

        restartBtn.addEventListener('click', startGame);
        resize();
        draw();
    </script>
</body>
</html>
