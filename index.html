<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>計算脳トレ 2000問</title>
    <style>
        :root {
            --primary-color: #007aff;
            --success-color: #34c759;
            --error-color: #ff3b30;
            --bg-color: #f2f2f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
        }

        #app {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        #stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 20px;
        }

        #question-container {
            margin-bottom: 30px;
        }

        #question-text {
            font-size: 32px;
            font-weight: 700;
            color: #1c1c1e;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #f2f2f7;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 12px;
            color: var(--primary-color);
            transition: transform 0.1s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: scale(0.95);
            background: #e5e5ea;
        }

        .option-btn.correct {
            background: var(--success-color) !important;
            color: white;
        }

        .option-btn.wrong {
            background: var(--error-color) !important;
            color: white;
        }

        #feedback {
            margin-top: 20px;
            height: 24px;
            font-weight: bold;
            font-size: 18px;
        }

        #next-container {
            margin-top: 20px;
            height: 50px;
        }

        #next-btn {
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        /* 完了画面 */
        #finish-screen {
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e5e5ea;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="game-ui">
        <div id="stats">
            <div id="progress-text">第 1 / 2000 問</div>
            <div id="score-text">正解: 0</div>
        </div>
        <div class="progress-bar-container">
            <div id="progress-fill"></div>
        </div>

        <div id="question-container">
            <p style="color:#8e8e93; margin-bottom: 8px;">この計算を解け</p>
            <div id="question-text">Loading...</div>
        </div>

        <div class="options-grid" id="options">
            <!-- ボタンが生成される -->
        </div>

        <div id="feedback"></div>

        <div id="next-container">
            <button id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <div id="finish-screen">
        <h1 style="font-size: 48px;">🎉</h1>
        <h2>全2000問達成！</h2>
        <p id="final-score"></p>
        <button class="option-btn" style="width:100%" onclick="location.reload()">もう一度挑戦</button>
    </div>
</div>

<script>
    const TOTAL_QUESTIONS = 2000;
    let currentCount = 1;
    let score = 0;
    let currentAnswer = 0;
    let isAnswered = false;

    // 問題生成ロジック
    function generateQuestion() {
        isAnswered = false;
        const types = ['+', '-', '*'];
        const type = types[Math.floor(Math.random() * types.length)];
        let n1, n2, questionText;

        if (type === '+') {
            n1 = Math.floor(Math.random() * 50) + 1;
            n2 = Math.floor(Math.random() * 50) + 1;
            currentAnswer = n1 + n2;
            questionText = `${n1} + ${n2}`;
        } else if (type === '-') {
            n1 = Math.floor(Math.random() * 50) + 20;
            n2 = Math.floor(Math.random() * n1) + 1;
            currentAnswer = n1 - n2;
            questionText = `${n1} - ${n2}`;
        } else {
            n1 = Math.floor(Math.random() * 12) + 2;
            n2 = Math.floor(Math.random() * 12) + 2;
            currentAnswer = n1 * n2;
            questionText = `${n1} × ${n2}`;
        }

        document.getElementById('question-text').innerText = questionText;
        generateOptions(currentAnswer);
    }

    // 選択肢生成（正解1つ + ダミー3つ）
    function generateOptions(correct) {
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        let choices = [correct];
        while (choices.length < 4) {
            let offset = Math.floor(Math.random() * 10) - 5;
            let dummy = correct + offset;
            if (dummy !== correct && dummy > 0 && !choices.includes(dummy)) {
                choices.push(dummy);
            } else if (dummy <= 0) {
                choices.push(correct + Math.floor(Math.random() * 20) + 1);
            }
        }

        // シャッフル
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = val;
            btn.onclick = () => checkAnswer(val, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        if (isAnswered) return;
        isAnswered = true;

        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');

        if (selected === currentAnswer) {
            score++;
            btn.classList.add('correct');
            feedback.innerText = '⭕ 正解！';
            feedback.style.color = 'var(--success-color)';
            document.getElementById('score-text').innerText = `正解: ${score}`;
        } else {
            btn.classList.add('wrong');
            feedback.innerText = `❌ 不正解（正解: ${currentAnswer}）`;
            feedback.style.color = 'var(--error-color)';
            
            // 正解のボタンをハイライト
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => {
                if (parseInt(b.innerText) === currentAnswer) {
                    b.classList.add('correct');
                }
            });
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentCount++;
        if (currentCount > TOTAL_QUESTIONS) {
            showFinish();
            return;
        }

        document.getElementById('progress-text').innerText = `第 ${currentCount} / ${TOTAL_QUESTIONS} 問`;
        document.getElementById('progress-fill').style.width = `${(currentCount / TOTAL_QUESTIONS) * 100}%`;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
        
        generateQuestion();
    }

    function showFinish() {
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('finish-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `2000問中 ${score}問 正解しました！`;
    }

    // 初回起動
    window.onload = generateQuestion;
</script>

</body>
</html>
