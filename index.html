<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI無限クイズ - 究極の挑戦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto+Sans+JP', sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            overscroll-behavior: none;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .answer-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .answer-btn:active {
            transform: scale(0.96);
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="game-container" class="w-full max-w-md glass-card p-6 shadow-2xl">
        <!-- 初期画面 -->
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl font-black text-gray-800 mb-2">AI無限クイズ</h1>
            <p class="text-indigo-600 font-bold mb-6 text-sm uppercase tracking-widest">Powered by Gemini AI</p>
            
            <div class="bg-gray-50 p-4 rounded-xl mb-6 text-left">
                <label class="block text-xs font-bold text-gray-500 mb-2">ジャンルを選択</label>
                <select id="genre-select" class="w-full p-3 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="一般常識">一般常識</option>
                    <option value="科学と自然">科学と自然</option>
                    <option value="歴史と文化">歴史と文化</option>
                    <option value="エンタメと芸能">エンタメと芸能</option>
                    <option value="最新テクノロジー">最新テクノロジー</option>
                    <option value="難読漢字">難読漢字</option>
                </select>
            </div>

            <button onclick="startGame()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 active:bg-indigo-800 transition">
                クイズを生成して開始
            </button>
        </div>

        <!-- ローディング画面 -->
        <div id="loading-screen" class="hidden text-center py-12">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-600 font-medium">AIが問題を考えています...</p>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="question-number" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase">Q 1 / 5</span>
                <span id="score-display" class="text-sm font-bold text-gray-500">SCORE: 0</span>
            </div>
            
            <div class="w-full bg-gray-100 h-1.5 rounded-full mb-6">
                <div id="progress" class="bg-indigo-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <h2 id="question-text" class="text-lg font-bold text-gray-800 mb-8 min-h-[80px]">
                問題を取得中...
            </h2>

            <div id="options-container" class="space-y-3"></div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden text-center">
            <h2 class="text-xl font-bold text-gray-800">結果発表</h2>
            <div class="text-6xl font-black text-indigo-600 my-6" id="final-score">0</div>
            <p id="result-message" class="text-gray-600 mb-8 px-4 font-medium">素晴らしい挑戦でした！</p>
            <button onclick="restartGame()" class="w-full py-4 bg-gray-800 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-gray-900 transition">
                別の問題に挑戦
            </button>
        </div>
    </div>

    <script>
        const apiKey = ""; // 実行環境から自動提供されます
        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const screens = {
            start: document.getElementById('start-screen'),
            loading: document.getElementById('loading-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };

        async function fetchAIQuestions() {
            const genre = document.getElementById('genre-select').value;
            const systemPrompt = `
                You are a professional quiz master. 
                Generate 5 difficult and interesting multiple-choice questions in Japanese about the topic: ${genre}.
                Format the response as a JSON object with this exact structure:
                {
                    "quizzes": [
                        {
                            "question": "question text",
                            "options": ["option1", "option2", "option3", "option4"],
                            "correct": 0 (index of correct option)
                        }
                    ]
                }
            `;

            const maxRetries = 5;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Generate the quiz JSON now." }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!response.ok) throw new Error('API Error');
                    
                    const data = await response.json();
                    const result = JSON.parse(data.candidates.content.parts.text);
                    return result.quizzes;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        }

        async function startGame() {
            showScreen('loading');
            try {
                quizData = await fetchAIQuestions();
                currentQuestionIndex = 0;
                score = 0;
                showScreen('quiz');
                showQuestion();
            } catch (error) {
                alert('エラーが発生しました。もう一度試してください。');
                showScreen('start');
            }
        }

        function showScreen(screenId) {
            Object.keys(screens).forEach(key => {
                screens[key].classList.toggle('hidden', key !== screenId);
            });
        }

        function showQuestion() {
            const currentQuestion = quizData[currentQuestionIndex];
            const questionTextEl = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const questionNumberEl = document.getElementById('question-number');
            const scoreDisplay = document.getElementById('score-display');
            const progressBar = document.getElementById('progress');

            questionTextEl.innerText = currentQuestion.question;
            questionNumberEl.innerText = `Q ${currentQuestionIndex + 1} / ${quizData.length}`;
            scoreDisplay.innerText = `SCORE: ${score}`;
            
            const progressPercent = (currentQuestionIndex / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.innerText = option;
                button.className = "answer-btn w-full py-4 px-5 text-left border border-gray-200 rounded-xl font-medium text-gray-700 bg-white hover:bg-indigo-50 hover:border-indigo-200 transition-all slide-in";
                button.style.animationDelay = `${index * 0.1}s`;
                button.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex) {
            const correctIndex = quizData[currentQuestionIndex].correct;
            const buttons = document.querySelectorAll('.answer-btn');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.replace('bg-white', 'bg-green-500');
                buttons[selectedIndex].classList.add('text-white', 'border-green-600');
                score += 20;
            } else {
                buttons[selectedIndex].classList.replace('bg-white', 'bg-red-500');
                buttons[selectedIndex].classList.add('text-white', 'border-red-600');
                buttons[correctIndex].classList.replace('bg-white', 'bg-green-500');
                buttons[correctIndex].classList.add('text-white', 'border-green-600');
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            showScreen('result');
            document.getElementById('progress').style.width = '100%';
            document.getElementById('final-score').innerText = score;
            
            let message = "";
            if (score === 100) message = "パーフェクト！AIの難問をすべてクリアしました！";
            else if (score >= 60) message = "素晴らしい！かなりの博識ですね。";
            else message = "あと一歩！もう一度AIに挑戦してみましょう。";
            
            document.getElementById('result-message').innerText = message;
        }

        function restartGame() {
            showScreen('start');
        }
    </script>
</body>
</html>
